name: AdVibe frontend and API contract checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Demo domain tests
        run: npm run test:demo
      - name: Backend B0 OpenAPI contract tests
        run: npm run test:contracts
      - name: Production build
        run: npm run build

  backend-verify:
    name: Express B23 production-gated B0–B23 backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: advibe_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: advibe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advibe_ci -d advibe_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_TEST_ALLOWED: "true"
      AUTH_SECRET: ci_only_dev_test_auth_secret_32_characters_long_value
      MFA_ENCRYPTION_KEY: "3f4e8bb1976542ac8ef51b03d9607a2acb8970645a1ed3c0b7d14982f63a0e57"
      DATABASE_URL: postgresql://advibe_ci:ci_only_password@localhost:5432/advibe_ci?schema=public
      DIRECT_URL: postgresql://advibe_ci:ci_only_password@localhost:5432/advibe_ci?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated backend dependencies
        run: npm install --prefix backend --no-audit --no-fund
      - name: Validate Prisma schema
        run: npm --prefix backend run db:validate
      - name: Apply versioned PostgreSQL migrations
        run: npm --prefix backend run db:migrate:deploy
      - name: Backend lint, types, DB integration, build, HTTP smoke
        run: npm --prefix backend run check
      - name: Re-run migrations to verify idempotency
        run: npm --prefix backend run db:migrate:deploy

  live-portal-smoke:
    name: B22 authenticated API-mode cross-portal Chromium
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    needs: [verify, backend-verify]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DEMO_MODE: "false"
      ADVIBE_BACKEND_ORIGIN: "https://api.example.invalid"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Assert API-mode proxy, auth and portal boundaries
        run: node --test tests/b22-api-integration.test.mjs
      - name: Build authenticated API frontend
        run: npm run build
      - name: Run cross-role API mode browser smoke with intercepted contract data
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --port 3101 >/tmp/advibe-b22-next.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3101; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/advibe-b22-next.log
            exit 1
          fi
          BASE_URL=http://127.0.0.1:3101 npm run test:live-browser
      - name: Save live browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: b22-live-browser-failures
          path: test-results/
          if-no-files-found: ignore

  browser-smoke:
    name: Chromium release smoke
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    needs: [verify, backend-verify]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Serve build and run browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --port 3100 > /tmp/advibe-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3100; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/advibe-next.log
            exit 1
          fi
          BASE_URL=http://127.0.0.1:3100 npm run test:browser
      - name: Save browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: part23-browser-failures
          path: test-results/
          if-no-files-found: ignore

  encrypted-restore-drill:
    name: B23 real encrypted PostgreSQL backup/restore drill (synthetic data)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: advibe_b23_ci
          POSTGRES_PASSWORD: ci_only_b23_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advibe_b23_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: advibe_b23_ci
      PGPASSWORD: ci_only_b23_password
      PGSSLMODE: prefer
    steps:
      - uses: actions/checkout@v4
      - name: Install age and PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq age postgresql-client
      - name: Create two disposable test databases and synthetic records
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE advibe_b23_source'
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE advibe_b23_restore'
          psql -v ON_ERROR_STOP=1 -d advibe_b23_source -c 'CREATE TABLE "User" ("id" integer PRIMARY KEY, "email" text NOT NULL)'
          psql -v ON_ERROR_STOP=1 -d advibe_b23_source -c 'CREATE TABLE "_prisma_migrations" ("id" text PRIMARY KEY)'
          psql -v ON_ERROR_STOP=1 -d advibe_b23_source -c "INSERT INTO \"User\" VALUES (7,'synthetic@example.invalid')"
          psql -v ON_ERROR_STOP=1 -d advibe_b23_source -c "INSERT INTO \"_prisma_migrations\" VALUES ('synthetic-b23')"
      - name: Generate disposable encryption identity and stream encrypted archive
        shell: bash
        run: |
          set -euo pipefail
          age-keygen -o "$RUNNER_TEMP/b23-test-identity.txt" 2>/dev/null
          recipient=$(age-keygen -y "$RUNNER_TEMP/b23-test-identity.txt")
          B23_BACKUP_RECIPIENT="$recipient" PGDATABASE=advibe_b23_source bash backend/scripts/backup-encrypted.sh "$RUNNER_TEMP/advibe-test.dump.age"
          if grep -aq 'synthetic@example.invalid' "$RUNNER_TEMP/advibe-test.dump.age"; then
            echo "Plaintext appeared in encrypted archive" >&2
            exit 1
          fi
          B23_RESTORE_ACK=YES_DISPOSABLE_DATABASE B23_AGE_IDENTITY_FILE="$RUNNER_TEMP/b23-test-identity.txt" PGDATABASE=advibe_b23_restore bash backend/scripts/restore-drill.sh "$RUNNER_TEMP/advibe-test.dump.age"
          test "$(psql -At -d advibe_b23_restore -c 'SELECT count(*) FROM "User" WHERE id=7')" = 1
          echo "PASS: authentic age encrypted PostgreSQL backup and isolated restore drill with synthetic data"
      - name: Erase ephemeral encryption identity and archive
        if: always()
        run: rm -f "$RUNNER_TEMP/b23-test-identity.txt" "$RUNNER_TEMP/advibe-test.dump.age"

  release-gates:
    name: B23 release preparation and fail-closed evidence validation
    runs-on: ubuntu-latest
    needs: [verify, backend-verify, live-portal-smoke, browser-smoke, encrypted-restore-drill]
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test B23 operational controls and unapproved release defaults
        run: npm run test:release-gates
      - name: Syntax-validate both disaster recovery scripts
        run: |
          bash -n backend/scripts/backup-encrypted.sh
          bash -n backend/scripts/restore-drill.sh
      - name: Confirm no remote deployment is implied by CI
        run: |
          test -f docs/backend/B23_IMPLEMENTATION.md
          test -f ops/b23-release-evidence.template.json
          echo "B23 CI checks complete: production signoff and live staging deployment are separate, manual gates."
