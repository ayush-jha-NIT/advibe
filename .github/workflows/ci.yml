name: AdVibe frontend and API contract checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Demo domain tests
        run: npm run test:demo
      - name: Backend B0 OpenAPI contract tests
        run: npm run test:contracts
      - name: Production build
        run: npm run build

  backend-verify:
    name: Express B8 device identity and secure pairing checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: advibe_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: advibe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advibe_ci -d advibe_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_TEST_ALLOWED: "true"
      AUTH_SECRET: ci_only_dev_test_auth_secret_32_characters_long_value
      MFA_ENCRYPTION_KEY: "3f4e8bb1976542ac8ef51b03d9607a2acb8970645a1ed3c0b7d14982f63a0e57"
      DATABASE_URL: postgresql://advibe_ci:ci_only_password@localhost:5432/advibe_ci?schema=public
      DIRECT_URL: postgresql://advibe_ci:ci_only_password@localhost:5432/advibe_ci?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated backend dependencies
        run: npm install --prefix backend --no-audit --no-fund
      - name: Validate Prisma schema
        run: npm --prefix backend run db:validate
      - name: Apply versioned PostgreSQL migrations
        run: npm --prefix backend run db:migrate:deploy
      - name: Backend lint, types, DB integration, build, HTTP smoke
        run: npm --prefix backend run check
      - name: Re-run migrations to verify idempotency
        run: npm --prefix backend run db:migrate:deploy

  browser-smoke:
    name: Chromium release smoke
    runs-on: ubuntu-latest
    needs: [verify, backend-verify]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Serve build and run browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --port 3100 > /tmp/advibe-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:3100; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/advibe-next.log
            exit 1
          fi
          BASE_URL=http://127.0.0.1:3100 npm run test:browser
      - name: Save browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: part23-browser-failures
          path: test-results/
          if-no-files-found: ignore
